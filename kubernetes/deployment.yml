apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-python-api
  labels:
    app: devops-python-api

spec:
  replicas: 2

  selector:
    matchLabels:
      app: devops-python-api

  template:
    metadata:
      labels:
        app: devops-python-api

    spec:
      containers:
        - name: devops-python-api
          image: devops-python-api:latest
          imagePullPolicy: Never

          ports:
            - containerPort: 5000

          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 20
